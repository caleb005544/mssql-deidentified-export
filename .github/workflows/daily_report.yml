name: Automated Daily Report

on:
  schedule:
    # 台灣時間每天早上 09:00 執行 (UTC 01:00)
    - cron: '0 8 * * *'
  workflow_dispatch: # 讓你可以手動點擊按鈕執行測試

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run main dispatch
        # 關鍵：將你存在 GitHub Secret 的 ENV 內容寫成臨時的 .env 檔案
        run: |
          echo "${{ secrets.ENV }}" > .env
          python main_dispatch.py